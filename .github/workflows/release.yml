name: 打包发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号（如 v1.0.0）'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build_win.py
            artifact: 信封信息提取系统-windows

    runs-on: ${{ matrix.os }}
    name: 打包 ${{ matrix.artifact }}

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements-build.txt

      - name: 执行打包
        env:
          PYTHONIOENCODING: utf-8
        run: python ${{ matrix.script }}

      - name: 压缩产物
        shell: pwsh
        run: Compress-Archive -Path "dist/信封信息提取系统/*" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    name: 发布 Release

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/**/*.zip
